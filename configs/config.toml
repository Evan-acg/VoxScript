[defaults]
output_dir = "./output"
model_name = "base"
device = "cuda"
language = ""

[llm]
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
temperature = 0.0
max_tokens = 32768
response_preview_chars = 500

[ffmpeg]
path = "ffmpeg"
probe_path = "ffprobe"

[fzf]
path = "fzf"
header = "Select audio track to extract:"

[audio]
sample_rate = 16000
channels = 1
codec = "pcm_s16le"
cache_dir = ""
extensions = [".mp3", ".wav", ".flac", ".m4a", ".ogg", ".aac", ".opus", ".wma"]

[whisper]
vad_method = "silero"
align = false
batch_size = 16
chunk_size = 5
compute_type_cuda = "float16"
compute_type_cpu = "float32"
fallback_language = "en"
min_estimate_seconds = 10
model_dir = "models"
local_files_only = false
align_cache_only = true

[progress]
color_system = "truecolor"
heartbeat_interval = 0.5
heartbeat_timeout = 2

[logging]
level = "INFO"
temp_prefix = "voxscript_"
